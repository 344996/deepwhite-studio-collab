<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark"><title>导入画廊提示词 · 深白片场</title><link rel="stylesheet" href="/static/studio-gallery-import.css?v=0.11.0-studio.2"><script defer src="/static/studio-gallery-import.js?v=0.11.0-studio.2"></script></head>
<body><header><a href="/">DW · 深白片场</a><a href="/">返回工作台</a></header>
<main><p class="eyebrow">画廊 → 本地画布</p><h1>把灵感带到你的画布</h1><p class="intro">检查提示词，选择存放项目，创建一张新的普通画布。随后可连接图片或视频节点，选择你的 API 和模型生成。</p>
<section class="file-panel"><label for="promptFile">导入提示词文件</label><input id="promptFile" type="file" accept=".json,application/json"><p>支持画廊导出的 deepwhite-prompt.json 文件，最大 64 KB。</p></section>
<p id="importStatus" role="status">等待提示词链接或文件。</p><p id="importError" role="alert" hidden></p>
<form id="importForm" hidden><div class="meta"><span id="sourceKind"></span><a id="sourceLink" target="_blank" rel="noopener noreferrer">查看来源作品 ↗</a></div>
<label>画布名称<input id="importTitle" maxlength="80" required></label>
<label>提示词<textarea id="importPrompt" rows="10" maxlength="8000" required></textarea></label>
<label>保存到项目<select id="importProject" required><option value="default">默认项目</option></select></label>
<p class="hint">导入会保存文字和来源链接。参考图片、视频、模型参数需要在画布里自行选择；点击导入不会发起生成或扣费。</p>
<div class="actions"><button id="importSubmit" type="submit">新建画布并带入提示词</button><a id="openImported" hidden>打开已创建的画布 →</a></div></form>
</main></body></html>
