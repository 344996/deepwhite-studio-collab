<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>布局样稿 · 第二版</title><style>
:root{--bg:#141414;--ink:#f7f7f7;--muted:rgba(255,255,255,.62);--faint:rgba(255,255,255,.3);--tint:rgba(255,255,255,.05);--tint2:rgba(255,255,255,.09);--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.16);--panel:#262626;--raised:#333;--node:#363636;--node-on:#a8a8a8;--link:#86909c;--dot:#474747}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:13px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei UI",system-ui,sans-serif;overflow:hidden}
button,input,textarea{font:inherit;color:inherit}button{cursor:pointer;background:none;border:0;padding:0}:focus-visible{outline:2px solid #fff;outline-offset:2px}
svg.i{fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
.switch{position:fixed;left:50%;top:8px;transform:translateX(-50%);z-index:90;display:flex;align-items:center;gap:2px;padding:3px;background:#000;border:1px solid var(--line2);border-radius:9px}
.switch span{padding:0 8px;color:var(--faint);font-size:11px;white-space:nowrap}.switch button{padding:2px 11px;border-radius:6px;color:var(--muted);font-size:12px}.switch button[aria-pressed=true]{background:#fff;color:#000;font-weight:500}
.screen{position:fixed;inset:0;display:none}.screen.on{display:block}

/* Home: 240 sidebar, 32 nav rows, 160 new-canvas card, 80x56 tool tiles, measured at 1440 wide */
.home{display:grid;grid-template-columns:240px 1fr;height:100%}
.side{display:flex;flex-direction:column;gap:12px;padding:16px 12px;border-right:1px solid rgba(255,255,255,.06);min-height:0}
.brand{display:flex;align-items:center;gap:8px;height:32px;padding:0 8px;font-size:16px;font-weight:600}
.mark{display:grid;place-items:center;width:22px;height:22px;border-radius:6px;background:#fff;color:#000;font-weight:800;font-size:12px}
.group{display:flex;flex-direction:column;gap:2px}.group h4{margin:0;padding:8px 8px 4px;font-size:12px;font-weight:500;color:var(--faint)}
.nav{display:flex;align-items:center;gap:8px;width:100%;height:32px;padding:0 8px;border-radius:6px;font-size:13px;text-align:left;color:#fff;transition:background .14s}.nav:hover,.nav.on{background:rgba(31,31,31,.95)}
.nav em{margin-left:auto;font-style:normal;font-size:11px;line-height:1;color:var(--faint)}.nav .ver{padding:2px 6px;border-radius:5px;background:var(--tint2);color:var(--muted)}
.grow{flex:1}
.main{overflow:auto;padding:16px 40px 40px;min-width:0;display:flex;flex-direction:column;gap:28px}
.top{display:flex;justify-content:flex-end;gap:8px;height:32px;margin-bottom:-12px;flex:none}
.ghost{height:32px;padding:0 10px;border:.8px solid var(--line);border-radius:8px;font-size:13px;color:#fff}.ghost:hover{background:var(--tint)}
.solid{height:32px;padding:0 10px;border-radius:8px;background:#fff;color:#000;font-size:14px;font-weight:500}
.new{flex:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:13px;width:100%;height:160px;border:.8px solid var(--line2);border-radius:12px;background:radial-gradient(rgba(255,255,255,.1) 1px,transparent 1.2px) 0 0/14px 14px,var(--tint);transition:background-color .15s}.new:hover{background-color:var(--tint2)}
.plusbtn{display:grid;place-items:center;width:88px;height:52px;border-radius:16px;border:.8px solid #2c2c2c;background:linear-gradient(180deg,#fff,#d8d8d8);color:#000;transition:transform .14s var(--e,ease)}.new:hover .plusbtn{transform:translateY(-1px)}.new b{font-size:16px;font-weight:500}
.tools{flex:none;display:flex;gap:8px;padding:8px 0;overflow-x:auto;scrollbar-width:none;margin-bottom:-12px}
.tool{flex:0 0 95px;display:flex;flex-direction:column;align-items:center;gap:8px}.tile{display:grid;place-items:center;width:80px;height:56px;border-radius:16px;background:var(--tint);transition:background .14s}.tool:hover .tile{background:var(--tint2)}.tool b{font-size:14px;font-weight:400}
h3{margin:0 0 12px;padding-left:8px;height:32px;line-height:32px;font-size:16px;font-weight:500}
.feats{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:16px}.feat{text-align:left}.feat img{display:block;width:100%;aspect-ratio:211/119;object-fit:cover;border-radius:12px;transition:transform .2s}.feat:hover img{transform:translateY(-2px)}
.feat span{display:flex;align-items:center;gap:6px;margin-top:12px;padding:0 8px}.feat b{font-size:14px;font-weight:400}.tag{padding:0 5px;border-radius:4px;background:rgba(185,231,207,.14);color:#b9e7cf;font-style:normal;font-size:11px;line-height:18px}
.tabs{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:12px;padding-left:8px}.tabs>div{display:flex;gap:28px}.tabs>div button{padding-bottom:8px;font-size:13px;color:var(--muted);border-bottom:2px solid transparent}.tabs>div button.on,.tabs>div button:hover{color:#fff}.tabs>div button.on{border-color:#fff}
.pill{display:flex;align-items:center;gap:8px;width:280px;height:40px;padding:0 16px;border:.8px solid #525252;border-radius:999px;background:#171717;color:var(--muted)}.pill input{flex:1;min-width:0;background:none;border:0;outline:0;font-size:14px;color:#fff}
.works{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}.work{text-align:left}.work img{display:block;width:100%;aspect-ratio:16/10;object-fit:cover;border-radius:12px;transition:transform .2s}.work:hover img{transform:translateY(-2px)}.work b{display:block;margin-top:10px;font-size:14px;font-weight:500}.work small{font-size:12px;color:var(--muted)}

/* Canvas */
.board{position:absolute;inset:0;background:radial-gradient(var(--dot) 1px,transparent 1.1px) 0 0/22px 22px,var(--bg);overflow:hidden}
.world{position:absolute;left:0;top:0;transform-origin:0 0}svg.links{position:absolute;left:0;top:0;width:6000px;height:4000px;overflow:visible;pointer-events:none}svg.links path{fill:none;stroke:var(--link);stroke-width:2}
.float{position:absolute;display:flex;align-items:center;gap:2px;padding:8px;background:#1f1f1f;border:.8px solid var(--line2);border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.35);z-index:30}
.tl{left:16px;top:16px;padding:4px 10px 4px 4px}.tr{right:16px;top:16px;padding:4px}.bc{left:50%;bottom:16px;transform:translateX(-50%)}.br{right:16px;bottom:16px;padding:4px}
.float button{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 9px;border-radius:8px;color:var(--muted);white-space:nowrap}.float button:hover{background:var(--tint2);color:#fff}.float button.on{background:var(--tint2);color:#fff}.float .add{width:36px;padding:0;justify-content:center;background:#fff;color:#000}.float .add:hover{background:#fff;color:#000}
.float hr{width:1px;height:18px;margin:0 4px;border:0;background:var(--line2)}.tl b{font-weight:500}.tl small{margin-left:6px;color:var(--faint);font-size:11px}.avatar{display:grid;place-items:center;width:26px;height:26px;margin:0 3px;border-radius:50%;background:var(--raised);font-size:12px}.zoomv{min-width:44px;text-align:center;color:var(--muted);font-size:12px}
.nd{position:absolute;width:520px;user-select:none}.nd .name{display:flex;align-items:center;gap:5px;height:26px;color:var(--muted);font-size:12px;cursor:grab}
.nd .frame{position:relative;height:292px;border:1px solid var(--node);border-radius:16px;background:var(--panel);overflow:hidden;cursor:grab;transition:border-color .14s}.nd.sel .frame{border-color:var(--node-on)}.nd:hover:not(.sel) .frame{border-color:#555}
.nd img{display:block;width:100%;height:100%;object-fit:cover;pointer-events:none}
.ph{position:relative;height:100%;padding:0 26px 22px;display:flex;flex-direction:column;justify-content:flex-end;color:var(--muted)}.ph .big{position:absolute;left:50%;top:42px;transform:translateX(-50%);color:#555}.ph p{margin:0 0 8px;font-size:13px}.ph button{display:flex;align-items:center;gap:8px;height:30px;padding-left:10px;color:#fff;font-size:13px}.ph button:hover{color:#cfcfcf}
.nd.text{width:360px}.nd.text .frame{height:auto;min-height:150px;padding:14px 16px;color:var(--ink);line-height:1.7;cursor:text}
.pt{position:absolute;top:172px;width:22px;height:22px;margin-top:-11px;border-radius:50%;background:var(--bg);border:1px solid #d0d0d0;color:#fff;display:none;place-items:center}.nd:hover .pt,.nd.sel .pt{display:grid}.pt.l{left:-32px}.pt.r{right:-32px}.pt:hover{background:#fff;color:#000}
.nd.text .pt{top:100px}
.comp{position:absolute;left:50%;top:calc(100% + 14px);transform:translateX(-50%);width:97.6%;min-width:430px;display:none;padding:12px 14px 10px;background:var(--panel);border-radius:16px;box-shadow:0 12px 34px rgba(0,0,0,.45);cursor:default;z-index:5}.nd.sel .comp{display:block}
.chips{display:flex;gap:4px;align-items:center}.chips button{display:inline-flex;align-items:center;gap:4px;height:24px;padding:0 9px;border-radius:999px;background:var(--raised);color:var(--muted);font-size:12px}.chips button:hover{color:#fff}.chips .exp{margin-left:auto;background:none;padding:0;color:var(--muted)}
.comp textarea{display:block;width:100%;height:64px;margin-top:6px;padding:4px;background:none;border:0;resize:none;outline:none;font-size:13px;color:var(--ink)}.comp textarea::placeholder{color:rgba(255,255,255,.28)}
.row{display:flex;align-items:center;gap:4px;font-size:12px}.row .pick{display:inline-flex;align-items:center;gap:4px;height:28px;padding:0 5px;border-radius:7px;color:#fff;white-space:nowrap}.row .pick:hover{background:var(--tint2)}.row hr{width:1px;height:14px;margin:0 3px;border:0;background:var(--line2)}.row .ico{display:grid;place-items:center;width:26px;height:26px;border-radius:7px;color:#fff}.row .ico:hover{background:var(--tint2)}
.row .cost{display:inline-flex;align-items:center;gap:2px;margin-left:auto;color:var(--muted);white-space:nowrap}.send{display:grid;place-items:center;width:30px;height:30px;margin-left:6px;border-radius:50%;background:#8a8a8a;color:#141414;flex:none;transition:background .14s}.send.ready{background:#fff}.send:disabled{opacity:.5}
.badge{position:absolute;left:12px;bottom:12px;padding:2px 10px;border-radius:999px;background:rgba(0,0,0,.72);font-size:11px;color:#fff}
.acts{position:absolute;left:50%;top:-8px;transform:translate(-50%,-100%);display:none;gap:2px;padding:4px;background:#1f1f1f;border:.8px solid var(--line2);border-radius:10px;z-index:6}.nd.sel .acts{display:flex}.acts button{height:24px;padding:0 7px;border-radius:6px;color:var(--muted);font-size:12px;white-space:nowrap}.acts button:hover{background:var(--tint2);color:#fff}
.menu{position:absolute;z-index:60;display:none;min-width:148px;padding:6px;background:#1f1f1f;border:.8px solid var(--line2);border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.4)}.menu.on{display:block}.menu button{display:flex;gap:8px;align-items:center;width:100%;height:32px;padding:0 8px;border-radius:7px;color:#fff}.menu button:hover{background:var(--tint2)}
.more{position:absolute;right:16px;top:60px;z-index:40;display:none;width:180px;padding:6px;background:#1f1f1f;border:.8px solid var(--line2);border-radius:12px}.more.on{display:block}.more button{display:block;width:100%;height:30px;padding:0 8px;border-radius:7px;color:var(--muted);text-align:left}.more button:hover{background:var(--tint2);color:#fff}
.map{position:absolute;right:16px;bottom:66px;width:170px;height:104px;display:none;background:#1f1f1f;border:.8px solid var(--line2);border-radius:10px;z-index:30}.map.on{display:block}.map i{position:absolute;background:#555;border-radius:2px}
@media (max-width:1100px){.feats{grid-template-columns:repeat(3,minmax(0,1fr))}.works{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:760px){.home{grid-template-columns:1fr}.side{display:none}.main{padding:44px 16px 24px}.tabs{flex-direction:column;align-items:stretch;gap:10px}.tabs>div{gap:16px;overflow-x:auto}.pill{width:100%}.top{flex-wrap:wrap;height:auto;margin:0}.lbl,.switch span,.tl small{display:none}.comp{min-width:0}.nd{width:330px}.nd .frame{height:190px}.pt{top:120px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>

<div class="float tr"><button aria-label="查找节点"><svg class="i" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg></button><button>任务记录</button><button>设置</button><button id="moreBtn" aria-expanded="false" aria-label="更多工具">···</button><span class="avatar">深</span></div>

<div class="float br"><button id="zo" aria-label="缩小">−</button><span class="zoomv" id="zv">100%</span><button id="zi" aria-label="放大">+</button><hr><button id="mapBtn" aria-expanded="false" aria-label="小地图"><svg class="i" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6l6-2 6 2 6-2v14l-6 2-6-2-6 2z"/><path d="M9 4v14M15 6v14"/></svg></button></div>
<div class="map" id="map"></div>

</section>
<section class="screen on" id="home" aria-label="首页样稿">
<div class="home"><aside class="side">
 <div class="brand"><span class="mark">D</span>深白片场</div>
 <div class="group"><button class="nav on" ><svg class="i" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11l8-7 8 7v9h-5v-6H9v6H4z"/></svg><span>首页</span></button><button class="nav" ><svg class="i" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h6l2 2h8v10H4z"/></svg><span>项目</span><em>3</em></button><button class="nav" ><svg class="i" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M4 10h16"/></svg><span>资产</span></button><button class="nav" ><svg class="i" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/><path d="M10 6.5h4a3 3 0 013 3V14"/></svg><span>工作流</span><em>›</em></button></div>
 <div class="group"><h4>创作</h4><button class="nav" id="toCanvas2"><svg class="i" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M12 9v6M9 12h6"/></svg><span>深白画布</span></button><button class="nav" ><svg class="i" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="8" width="14" height="11" rx="3"/><path d="M12 4v4M9 13h.01M15 13h.01"/></svg><span>外接智能体</span></button></div>

</aside><main class="main">

  const media=n.kind==='text'?esc(n.text):n.url?`<img src="${n.url}" alt="">`:`<div class="ph"><span class="big">${icon(ic,72)}</span><p>尝试：</p><button data-try>${icon('upload')}${n.kind==='video'?'图生视频':'图生图'}</button><button data-try>${icon('hd')}${n.kind==='video'?'首尾帧':'图片高清'}</button></div>`;
  const comp=n.kind==='text'?'':`<div class="comp" data-comp><div class="chips"><button>${icon('plus',13)}参考</button><button>风格</button><button>MJ 码</button><button>滤镜</button><button class="exp" aria-label="放大输入框">${icon('expand')}</button></div><textarea aria-label="提示词" placeholder="可直接文字生图，或连接图片后输入修改要求，如：将背景改为雪夜">${esc(n.prompt)}</textarea><div class="row"><button class="pick">${icon('spark',15)}${model}${icon('chev',14)}</button><hr><button class="pick">${icon('ratio',15)}16:9 · 2K · 1 张${icon('chev',14)}</button><hr><button class="ico" aria-label="翻译提示词">${icon('lang')}</button><button class="ico" aria-label="更多参数">${icon('sliders')}</button><span class="cost">${icon('bolt',13)}¥0.054</span><button class="send ${n.prompt?'ready':''}" data-send aria-label="生成" ${n.running?'disabled':''}>${icon('arrow')}</button></div></div>`;
  return `<article class="nd ${n.kind==='text'?'text':''} ${n.id===sel?'sel':''}" data-id="${n.id}" style="left:${n.x}px;top:${n.y}px"><div class="name">${icon(ic,14)}${esc(n.name)}</div><div class="acts"><button>复制</button><button>成组</button><button>定位</button><button data-del>删除</button></div><div class="frame">${media}${n.running?'<span class="badge">生成中…</span>':''}</div><button class="pt l" aria-label="连接上游">${icon('plus',13)}</button><button class="pt r" data-next aria-label="添加下游节点">${icon('plus',13)}</button>${comp}</article>`;}).join('');drawLinks();$('#map').innerHTML=list.map(n=>`<i style="left:${8+n.x/11}px;top:${6+n.y/11}px;width:44px;height:24px"></i>`).join('');}
 const addNode=(kind,x,y,from)=>{count++;const id='n'+count;list.push({id,kind,x,y,name:KIND[kind][1]+' '+count,prompt:'',text:kind==='text'?'在这里写文字…':''});if(from)links.push([from,id]);sel=id;render();};
 let drag=null;
 $('#board').addEventListener('pointerdown',e=>{$('#menu').classList.remove('on');const nd=e.target.closest('.nd');if(!nd){sel=null;render();drag={pan:true,sx:e.clientX,sy:e.clientY,vx:view.x,vy:view.y};return;}if(e.target.closest('[data-comp],button,textarea'))return;const n=list.find(i=>i.id===nd.dataset.id);if(sel!==n.id){sel=n.id;render();}drag={n,sx:e.clientX,sy:e.clientY,x:n.x,y:n.y};});
 addEventListener('pointermove',e=>{if(!drag)return;if(drag.pan){view.x=drag.vx+e.clientX-drag.sx;view.y=drag.vy+e.clientY-drag.sy;apply();return;}drag.n.x=drag.x+(e.clientX-drag.sx)/view.s;drag.n.y=drag.y+(e.clientY-drag.sy)/view.s;const el=holder.querySelector(`[data-id="${drag.n.id}"]`);el.style.left=drag.n.x+'px';el.style.top=drag.n.y+'px';drawLinks();});
 addEventListener('pointerup',()=>{drag=null;});
 holder.addEventListener('click',e=>{const nd=e.target.closest('.nd');if(!nd)return;const n=list.find(i=>i.id===nd.dataset.id);if(e.target.closest('[data-del]')){list=list.filter(i=>i!==n);links=links.filter(l=>!l.includes(n.id));sel=null;render();return;}if(e.target.closest('[data-next]')){addNode('image',n.x+600,n.y,n.id);return;}if(e.target.closest('[data-send]')){n.prompt=nd.querySelector('textarea').value;n.running=true;n.url='';render();setTimeout(()=>{n.running=false;n.url=SCENE;render();},1400);}});
 holder.addEventListener('input',e=>{if(e.target.tagName==='TEXTAREA'){const nd=e.target.closest('.nd'),n=list.find(i=>i.id===nd.dataset.id);n.prompt=e.target.value;nd.querySelector('.send').classList.toggle('ready',!!n.prompt.trim());}});
 const openMenu=(cx,cy,wx,wy)=>{const m=$('#menu');m.style.left=Math.max(8,Math.min(cx,innerWidth-164))+'px';m.style.top=Math.max(8,Math.min(cy,innerHeight-180))+'px';m.classList.add('on');m.dataset.x=wx??(cx-view.x)/view.s;m.dataset.y=wy??(cy-view.y)/view.s;};
 $('#board').addEventListener('dblclick',e=>{if(!e.target.closest('.nd'))openMenu(e.clientX,e.clientY);});
 $('#addBtn').onclick=e=>{const r=e.currentTarget.getBoundingClientRect();openMenu(r.left,r.top-176,(innerWidth/2-260-view.x)/view.s,(innerHeight/2-240-view.y)/view.s);};
 $('#menu').onclick=e=>{const b=e.target.closest('[data-add]');if(!b)return;addNode(b.dataset.add,+$('#menu').dataset.x,+$('#menu').dataset.y);$('#menu').classList.remove('on');};
 const toggle=(btn,box)=>{btn.onclick=()=>{const on=box.classList.toggle('on');btn.setAttribute('aria-expanded',on);};};toggle($('#moreBtn'),$('#more'));toggle($('#mapBtn'),$('#map'));
 const zoom=f=>{view.s=Math.min(2,Math.max(.25,+(view.s*f).toFixed(2)));apply();};$('#zi').onclick=()=>zoom(1.2);$('#zo').onclick=()=>zoom(1/1.2);
 $('#board').addEventListener('wheel',e=>{e.preventDefault();if(e.ctrlKey)zoom(e.deltaY<0?1.1:1/1.1);else{view.x-=e.deltaX;view.y-=e.deltaY;apply();}},{passive:false});
 addEventListener('keydown',e=>{if(e.key==='Escape'&&!e.target.closest('textarea')){sel=null;$('#menu').classList.remove('on');$('#more').classList.remove('on');render();}});
 const mode=on=>{$('#sel').classList.toggle('on',on);$('#hand').classList.toggle('on',!on);};$('#sel').onclick=()=>mode(true);$('#hand').onclick=()=>mode(false);
 apply();render();
})();
</script></body></html>
